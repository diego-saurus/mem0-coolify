services:
  mem0:
    build:
      context: ..
      dockerfile: server/dev.Dockerfile
    volumes:
      - mem0-history:/app/history
      - .:/app
    command: >
      sh -c "rm -rf /app/packages && pip install -q --force-reinstall --no-deps mem0ai && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=
      - DASHBOARD_URL=http://mem0-dashboard:3000
      - OPENAI_BASE_URL=${SERVICE_OPENAI_BASE_URL_MEM0}
      - OPENAI_API_KEY=${SERVICE_OPENAI_API_KEY_MEM0}
      - MEM0_DEFAULT_EMBEDDER_MODEL=${SERVICE_DEFAULT_EMBEDDER_MODEL_MEM0}
      - MEM0_DEFAULT_LLM_MODEL=${SERVICE_DEFAULT_EMBEDDER_LLM_MEM0}
      - ADMIN_API_KEY=${SERVICE_ADMIN_API_KEY_MEM0}
      - APP_DB_NAME=${SERVICE_DB_NAME_MEM0:-mem0}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - MEM0_TELEMETRY=${MEM0_TELEMETRY:-true}
      - POSTGRES_HOST=${SERVICE_DB_HOST_MEM0}
      - POSTGRES_PORT=${SERVICE_DB_PORT_MEM0:-5432}
      - POSTGRES_DB=${SERVICE_DB_NAME_MEM0:-mem0}
      - POSTGRES_USER=${SERVICE_DB_USER_MEM0:-postgres}
      - POSTGRES_PASSWORD=${SERVICE_DB_PASSWORD_MEM0}
      - POSTGRES_COLLECTION_NAME=${SERVICE_COLLECTION_NAME_MEM0:-memories}

  mem0-dashboard:
    build: ./dashboard
    environment:
      - NEXT_PUBLIC_API_URL=https://${SERVICE_FQDN_MEM0}
      - API_INTERNAL_URL=http://mem0:8000
      - NEXT_PUBLIC_INSTANCE_NAME=Mem0
    depends_on:
      mem0:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
