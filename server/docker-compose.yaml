services:
  mem0:
    build:
      context: ..
      dockerfile: server/dev.Dockerfile
    volumes:
      - mem0-history:/app/history
      - .:/app
    command: >
      sh -c "rm -rf /app/packages && pip install -q --force-reinstall --no-deps mem0ai && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=
      - DASHBOARD_URL=http://mem0-dashboard:3000
      - APP_DB_NAME=${SERVICE_MEM0_DB_NAME:-mem0}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - MEM0_TELEMETRY=${MEM0_TELEMETRY:-true}
      - POSTGRES_HOST=${SERVICE_MEM0_DB_HOST}
      - POSTGRES_PORT=${SERVICE_MEM0_DB_PORT:-5432}
      - POSTGRES_DB=${SERVICE_MEM0_DB_NAME:-mem0}
      - POSTGRES_USER=${SERVICE_MEM0_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${SERVICE_MEM0_DB_PASSWORD}
      - POSTGRES_COLLECTION_NAME=${SERVICE_MEM0_COLLECTION_NAME:-memories}

  mem0-dashboard:
    build: ./dashboard
    environment:
      - NEXT_PUBLIC_API_URL=https://${SERVICE_FQDN_MEM0_DASHBOARD}
      - API_INTERNAL_URL=http://mem0:8000
      - NEXT_PUBLIC_INSTANCE_NAME=Mem0
    depends_on:
      mem0:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
